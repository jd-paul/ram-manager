<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Frozen — RAM Manager</title>
  <link rel="icon" type="image/png" href="../icons/icon32.png">
  <script src="js/theme-fouc.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="suspended/suspended.css">
</head>
<body>
  <div class="frozen-container">
    <div class="frozen-card">
      <img class="frozen-favicon" id="favicon" src="" alt="">
      <h1 class="frozen-title" id="title">Loading…</h1>
      <p class="frozen-url" id="url"></p>
      <p class="frozen-message">This tab has been frozen to free up memory.</p>
      <button class="btn btn-primary" id="btn-restore" type="button">Restore Tab</button>
    </div>
  </div>
  <script type="module" src="suspended/suspended.js"></script>
</body>
</html>
