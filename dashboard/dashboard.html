<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>RAM Manager — Dashboard</title>
  <link rel="icon" type="image/png" href="../icons/icon32.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>
  <header class="dashboard-header">
    <div class="header-left">
      <img src="../images/logo-with-text.png" alt="RAM Manager" class="dashboard-logo" width="180">
      <span class="header-subtitle">Dashboard</span>
    </div>
    <div class="header-right">
      <a id="link-settings" class="header-link" href="#">Settings</a>
    </div>
  </header>

  <main class="dashboard-main">
    <!-- Summary Cards -->
    <section class="summary-section" aria-label="Summary statistics">
      <div class="card summary-card">
        <div class="summary-label">Saved Today</div>
        <div class="summary-value" id="stat-saved-today">—</div>
      </div>
      <div class="card summary-card">
        <div class="summary-label">Saved All-Time</div>
        <div class="summary-value" id="stat-saved-alltime">—</div>
      </div>
      <div class="card summary-card">
        <div class="summary-label">Suspended Tabs</div>
        <div class="summary-value" id="stat-suspended">—</div>
      </div>
      <div class="card summary-card">
        <div class="summary-label">Total Tabs</div>
        <div class="summary-value" id="stat-total-tabs">—</div>
      </div>
    </section>

    <!-- Charts Row -->
    <section class="charts-row" aria-label="Memory charts">
      <!-- Donut Chart — Active vs Suspended -->
      <div class="card chart-card">
        <div class="chart-header">
          <h2>Memory Breakdown</h2>
          <span class="memory-badge" id="memory-badge" style="margin-left: 8px;" hidden>Estimated</span>
        </div>
        <div class="donut-wrap">
          <svg class="donut-chart" viewBox="0 0 120 120" id="donut-chart">
            <circle class="donut-track" cx="60" cy="60" r="50" />
            <circle class="donut-fill donut-fill--active" cx="60" cy="60" r="50" id="donut-fill-active" />
            <circle class="donut-fill donut-fill--suspended" cx="60" cy="60" r="50" id="donut-fill-suspended" />
          </svg>
          <div class="donut-label">
            <span class="donut-value" id="stat-memory">—</span>
            <span class="donut-unit" id="stat-memory-unit"></span>
          </div>
        </div>
        <div class="donut-legend" id="donut-legend">
          <span class="legend-item"><span class="legend-dot active"></span> Active</span>
          <span class="legend-item"><span class="legend-dot suspended"></span> Suspended</span>
        </div>
      </div>

      <!-- Weekly Bar Chart — Memory Saved -->
      <div class="card chart-card chart-card--wide">
        <div class="chart-header">
          <h2>Memory Saved This Week</h2>
          <span class="chart-period" id="chart-week-label"></span>
        </div>
        <div class="bar-chart-wrap">
          <svg class="bar-chart" viewBox="0 0 560 180" id="bar-chart">
            <!-- Grid lines -->
            <line x1="0" y1="45" x2="560" y2="45" class="bar-grid" />
            <line x1="0" y1="90" x2="560" y2="90" class="bar-grid" />
            <line x1="0" y1="135" x2="560" y2="135" class="bar-grid" />
            <!-- Bars will be injected by JS -->
            <g id="bar-chart-bars"></g>
          </svg>
          <div class="bar-chart-labels" id="bar-chart-labels">
            <!-- Day labels injected by JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- Two-column layout for consumers + timeline -->
    <section class="two-col" aria-label="Details">
      <!-- Top Memory Consumers -->
      <div class="card consumers-card">
        <h2>Top Memory Consumers</h2>
        <ul class="consumer-list" id="consumer-list">
          <li class="consumer-empty">No tab memory data available.</li>
        </ul>
      </div>

      <!-- Session Timeline -->
      <div class="card timeline-card">
        <h2>Session Timeline</h2>
        <ul class="timeline-list" id="timeline-list">
          <li class="timeline-empty">No recent activity.</li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="dashboard-footer">
    <span>Auto-refreshes every 30 seconds</span>
  </footer>

  <script type="module" src="dashboard.js"></script>
</body>

</html>
